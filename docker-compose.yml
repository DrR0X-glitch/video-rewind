services:
  postgres:
    image: postgres:18-alpine
    container_name: dvd-store-postgres
    environment:
      POSTGRES_DB: dvd_store
      POSTGRES_USER: dvd
      POSTGRES_PASSWORD: dvd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvd -d dvd_store"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./backups:/backups

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dvd-store-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dvd:dvd@postgres:5432/dvd_store
      SEED_DEV_DB: "true"
      # TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN}
      # OMDB_API_KEY:
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
