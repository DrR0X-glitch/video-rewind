services:
  postgres:
    image: postgres:18-alpine
    container_name: dvd-store-postgres
    environment:
      POSTGRES_DB: dvd_store
      POSTGRES_USER: dvd
      POSTGRES_PASSWORD: dvd
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvd -d dvd_store"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backups

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dvd-store-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dvd:dvd@postgres:5432/dvd_store
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dvd:dvd@postgres:5432/dvd_store
      NODE_ENV: production
    command: ["node", "scripts/migrate-db.mjs"]

  db-seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dvd:dvd@postgres:5432/dvd_store
      NODE_ENV: development
    command: ["node", "scripts/seed-dev-db.mjs"]

volumes:
  postgres_data:
